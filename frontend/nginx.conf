server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Лимит чуть больше 20 МБ файла — запас на multipart-обвязку
    client_max_body_size 21m;

    # Docker DNS: IP backend перечитывается после пересоздания контейнера
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    # Заголовки безопасности подключаются в КАЖДОМ location:
    # add_header внутри location отменяет заголовки уровня server.

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Хэшированные ассеты — кэш надолго
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: все остальные пути отдают index.html без кэша
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
