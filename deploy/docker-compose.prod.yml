# Прод-надстройка над корневым docker-compose.yml:
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d --build
# Отличия от локального запуска: наружу только proxy (80/443), секреты обязательны, secure-куки, HTTPS.
name: affsaints

services:
  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в deploy/.env.prod}
    ports: !reset []
    restart: unless-stopped

  backend:
    environment:
      APP_DATABASE_URL: postgresql+asyncpg://affsaints:${POSTGRES_PASSWORD}@db:5432/affsaints
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Задайте APP_JWT_SECRET (не короче 32 символов)}
      APP_COOKIE_SECURE: "true"
      APP_DEMO_MODE: ${APP_DEMO_MODE:-true}
      APP_SEED_ON_START: "1"
    ports: !reset []

  frontend:
    ports: !reset []

  proxy:
    build: ./deploy/proxy
    environment:
      DOMAIN: ${DOMAIN:?Задайте DOMAIN, например creative.example.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
    restart: unless-stopped

  # Выпуск и продление сертификата Let's Encrypt (webroot через proxy)
  certbot:
    image: certbot/certbot:v3.0.1
    volumes:
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]
    restart: unless-stopped

volumes:
  certbot_www:
  letsencrypt:
